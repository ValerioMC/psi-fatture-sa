[package]
name = "psi-fatture-sa"
version = "0.1.0"
description = "PSI Fatture - Gestionale fatture per psicologi"
authors = ["Valerio"]
license = "MIT"
edition = "2021"

[lib]
name = "psi_fatture_sa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Keeps the Sogei test environment in a release build, for the developer only.
# Debug builds always have it; distributed releases must not enable this.
sogei-test = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
quick-xml = "0.37"
rsa = "0.9"
x509-cert = { version = "0.2", features = ["pem"] }
rand = "0.8"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["sync", "time"] }
log = { version = "0.4", features = ["kv"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
machine-uid = "0.5"
krilla = { version = "0.8", default-features = false }
skrifa = "0.42"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
