<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d70f6"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f8"/>
    </linearGradient>
    <linearGradient id="psi" gradientUnits="userSpaceOnUse" x1="0" y1="-206" x2="0" y2="36">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="squircleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="docShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1e1b4b" flood-opacity="0.45"/>
    </filter>
    <filter id="badgeShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e1b4b" flood-opacity="0.4"/>
    </filter>
    <clipPath id="squircleClip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- Squircle base -->
  <g filter="url(#squircleShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>

  <g clip-path="url(#squircleClip)">
    <!-- ambient glow behind the document -->
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>

    <!-- Invoice document -->
    <g transform="translate(512 500) rotate(-5)">
      <g filter="url(#docShadow)">
        <path d="M -179,-280 H 105 L 215,-170 V 244 Q 215,280 179,280 H -179 Q -215,280 -215,244 V -244 Q -215,-280 -179,-280 Z"
              fill="url(#paper)"/>
      </g>
      <!-- folded corner -->
      <path d="M 105,-280 L 105,-206 Q 105,-170 141,-170 L 215,-170 Z" fill="#c7d2fe"/>

      <!-- Psi symbol -->
      <g stroke="url(#psi)" stroke-width="34" stroke-linecap="round" fill="none">
        <path d="M -86,-184 v 58 a 86,86 0 0 0 172,0 v -58"/>
        <path d="M 0,-198 V 30"/>
      </g>

      <!-- invoice lines -->
      <g stroke="#dde3f0" stroke-width="22" stroke-linecap="round">
        <path d="M -142,108 H 62"/>
        <path d="M -142,164 H 128"/>
        <path d="M -142,220 H -24"/>
      </g>
    </g>
  </g>

  <!-- Euro badge (overlaps document corner, outside clip so it stays crisp) -->
  <g transform="translate(706 742)">
    <circle r="118" fill="url(#badge)" filter="url(#badgeShadow)"/>
    <circle r="118" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>
    <g stroke="#ffffff" stroke-width="24" stroke-linecap="round" fill="none">
      <path d="M 42,-42 A 58,58 0 1 0 42,42"/>
      <path d="M -70,-15 H 20"/>
      <path d="M -70,15 H 12"/>
    </g>
  </g>

  <!-- top light for depth -->
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
</svg>
