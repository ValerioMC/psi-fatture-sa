<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!--
    PSI Fatture app icon: the Ψ alone, as a sculpted object on an ink squircle.
    Layers, back to front: squircle and its cast shadow, a lamp glow from the
    top, a recessed glass lens, the Ψ's shadow in the lens, its extruded body,
    the lit face with a bevelled top edge and shaded underside, and finally the
    squircle's gloss and rim light. Macos grid: 824px squircle on a 1024 canvas.
  -->
  <defs>
    <!-- The Ψ, drawn once and reused by every layer. -->
    <path id="psi" d="M367 350 V437 A145 145 0 0 0 657 437 V350 M512 322 V702" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#7c7ffb"/>
      <stop offset="0.45" stop-color="#5249e6"/>
      <stop offset="1" stop-color="#2b2587"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.32" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.6" stop-color="#140f4a" stop-opacity="0"/>
      <stop offset="1" stop-color="#140f4a" stop-opacity="0.45"/>
    </radialGradient>

    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!--
      The wings: ψυχή is the Greek for both "soul" and "butterfly", and Psyche is
      drawn with butterfly wings. Here the Ψ is the butterfly's body and two
      pairs of wings open behind it, carved tone-on-tone: the soul the discipline is
      named after, and the metamorphosis that is the work of therapy.
    -->
    <!-- One side of the butterfly; the other is its mirror. -->
    <g id="wingPair">
      <path id="wingU" d="M512 494 C474 420 386 302 296 270 C224 244 166 282 170 352 C174 432 262 494 400 508 C452 513 492 512 512 510 Z"/>
      <path id="wingL" d="M512 526 C452 532 360 560 320 618 C286 668 300 728 356 730 C418 732 478 646 512 554 Z"/>
    </g>
    <g id="wings">
      <use href="#wingPair"/>
      <use href="#wingPair" transform="matrix(-1 0 0 1 1024 0)"/>
    </g>
    <g id="veins" fill="none" stroke-linecap="round">
      <g id="veinSide">
        <path d="M506 494 C440 420 340 320 262 288"/>
        <path d="M506 502 C430 460 300 400 196 372"/>
        <path d="M508 532 C456 570 380 630 340 700"/>
      </g>
      <use href="#veinSide" transform="matrix(-1 0 0 1 1024 0)"/>
    </g>
    <clipPath id="wingsClip"><use href="#wingU"/><use href="#wingL"/><use href="#wingU" transform="matrix(-1 0 0 1 1024 0)"/><use href="#wingL" transform="matrix(-1 0 0 1 1024 0)"/></clipPath>

    <!--
      Bas-relief: the wings are cut from the same ink as the ground. Only their
      edges show them: lit where they face the lamp, shaded where they turn away.
    -->
    <mask id="wingLit" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <use href="#wings" fill="#ffffff"/>
      <use href="#wings" fill="#000000" transform="translate(3 6)"/>
    </mask>
    <mask id="wingShade" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <use href="#wings" fill="#ffffff"/>
      <use href="#wings" fill="#000000" transform="translate(-3 -6)"/>
    </mask>

    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#c4c6ff" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#8f92ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#8f92ff" stop-opacity="0"/>
    </radialGradient>

    <!-- The Ψ's body: face from white to pale periwinkle, sides in deep ink. -->
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="420" y1="322" x2="600" y2="702">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eef0ff"/>
      <stop offset="1" stop-color="#c3c6ff"/>
    </linearGradient>
    <linearGradient id="side" gradientUnits="userSpaceOnUse" x1="0" y1="322" x2="0" y2="740">
      <stop offset="0" stop-color="#8a8cf5"/>
      <stop offset="0.5" stop-color="#4a43c9"/>
      <stop offset="1" stop-color="#241d7a"/>
    </linearGradient>

    <!-- Bevel masks: the face minus itself shifted down gives the lit top edge; shifted up, the shaded underside. -->
    <mask id="topEdge" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <use href="#psi" stroke="#ffffff" stroke-width="62"/>
      <use href="#psi" stroke="#000000" stroke-width="62" transform="translate(0 8)"/>
    </mask>
    <mask id="underside" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <use href="#psi" stroke="#ffffff" stroke-width="62"/>
      <use href="#psi" stroke="#000000" stroke-width="62" transform="translate(0 -11)"/>
    </mask>
    <!-- A soft sheen down the middle of each stroke, as on a rounded bar of glass. -->
    <mask id="core" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <use href="#psi" stroke="#ffffff" stroke-width="14" transform="translate(-5 -5)" filter="url(#soft6)"/>
    </mask>

    <filter id="soft2" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="soft6" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft14" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft30" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="squircleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dy="18" result="blur"/>
      <feFlood flood-color="#0b0830" flood-opacity="0.45"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Squircle ─────────────────────────────────────────────────────────── -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#squircleShadow)"/>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#lamp)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#vignette)"/>

    <!-- Light behind the Ψ, so it stands out from the ink. -->
    <circle cx="512" cy="500" r="340" fill="url(#halo)"/>

    <!-- ── Wings: a bas-relief in the ground's own ink ─────────────────────── -->
    <g>
      <!-- A faint shadow where the raised shape meets the ground. -->
      <use href="#wings" fill="#0e0a3c" fill-opacity="0.1" transform="translate(2 7)" filter="url(#soft6)"/>
      <!-- The raised face: the ground itself, a breath lighter. -->
      <use href="#wings" fill="#ffffff" fill-opacity="0.035"/>
      <g mask="url(#wingLit)"><rect width="1024" height="1024" fill="#ffffff" fill-opacity="0.2" filter="url(#soft2)"/></g>
      <g mask="url(#wingShade)"><rect width="1024" height="1024" fill="#0e0a3c" fill-opacity="0.26" filter="url(#soft2)"/></g>
      <!-- Veins engraved into the face: a dark groove with a lit lip below it. -->
      <g clip-path="url(#wingsClip)">
        <use href="#veins" stroke="#0e0a3c" stroke-opacity="0.12" stroke-width="3"/>
        <use href="#veins" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2" transform="translate(0 2)"/>
      </g>
    </g>

    <!-- ── Ψ: cast shadow, extruded body, face, bevels ──────────────────── -->
    <use href="#psi" stroke="#0e0a3c" stroke-opacity="0.55" stroke-width="68" transform="translate(10 44)" filter="url(#soft30)"/>
    <use href="#psi" stroke="#0e0a3c" stroke-opacity="0.35" stroke-width="64" transform="translate(4 24)" filter="url(#soft14)"/>

    <g stroke="url(#side)" stroke-width="62">
      <use href="#psi" transform="translate(2 22)"/>
      <use href="#psi" transform="translate(2 19)"/>
      <use href="#psi" transform="translate(1 16)"/>
      <use href="#psi" transform="translate(1 13)"/>
      <use href="#psi" transform="translate(1 10)"/>
      <use href="#psi" transform="translate(0 7)"/>
      <use href="#psi" transform="translate(0 4)"/>
    </g>
    <!-- The edge where the side meets the face catches a thin line of light. -->
    <use href="#psi" stroke="#b9bbff" stroke-width="64" transform="translate(0 3)"/>

    <use href="#psi" stroke="url(#face)" stroke-width="62"/>
    <g mask="url(#underside)"><rect width="1024" height="1024" fill="#5b55d6" fill-opacity="0.32" filter="url(#soft2)"/></g>
    <g mask="url(#topEdge)"><rect width="1024" height="1024" fill="#ffffff" fill-opacity="0.95"/></g>
    <g mask="url(#core)"><rect width="1024" height="1024" fill="#ffffff" fill-opacity="0.5"/></g>

    <!-- ── Gloss and rim light on the squircle ───────────────────────────── -->
    <path d="M100 285 Q100 100 285 100 H739 Q924 100 924 285 V360 Q512 250 100 420 Z" fill="url(#gloss)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3"/>
  <rect x="104" y="104" width="816" height="816" rx="181" fill="none" stroke="#0b0830" stroke-opacity="0.18" stroke-width="2"/>
</svg>
